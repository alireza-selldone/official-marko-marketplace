<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Shop fashion from Alio and electronics from Merino in the Marko marketplace." />
    <meta name="shop-name" content="Marko" />
    <meta name="pajulina-app-name" content="Marko Storefront" />
    <meta name="pajulina-client-id" content="" />
    <meta name="pajulina-shop-id" content="15596" />
    <meta name="pajulina-shop-name" content="Marko" />
    <meta name="pajulina-shop-domain" content="marko-5vMFPy7t.myselldone.com" />
    <meta name="pajulina-storefront-shop-handle" content="marko-5vMFPy7t" />
    <meta name="pajulina-dashboard-path" content="/dashboard/" />
    <meta name="pajulina-callback-path" content="/callback/" />
    <meta name="pajulina-selldone-base" content="https://selldone.com" />
    <meta name="pajulina-api-base" content="https://api.selldone.com" />
    <meta name="pajulina-xapi-base" content="https://xapi.selldone.com" />
    <meta name="pajulina-auth-prompt" content="consent" />
    <meta name="shop-prefix-address" content="" />
    <meta name="custom-home" content="shop" />
    <meta content="https://selldone.com" name="service-url" />
    <meta content="https://xapi.selldone.com" name="selldone-xapi" />
    <meta content="https://cdn.selldone.com/app" name="selldone-cdn-images" />
    <link rel="preconnect" href="https://cdn.selldone.com" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
      <script type="module" src="brands.js"></script>
</head>
  <body class="market-home">
    <a class="skip" href="#main">Skip to content</a>
    <div class="page fashioni-page">
      <header class="hdr" data-shared-chrome="v2"></header>
      <main id="main" tabindex="-1" class="brand-page">

        <section class="brand-head">
          <div class="wrap brand-head__inner">
            <p class="eyebrow">Discover</p>
            <h1>Shop by brand</h1>
            <p class="lede" data-brand-summary>Loading the brand directory…</p>
            <label class="brand-search">
              <span class="sr">Search brands</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
              <input type="search" autocomplete="off" placeholder="Search brands" data-brand-search>
            </label>
          </div>
        </section>

        <section class="section brand-section" id="featured" aria-labelledby="featured-title">
          <div class="wrap">
            <div class="brand-section__head"><div><p class="eyebrow">Start here</p><h2 id="featured-title">Popular brands</h2></div><a href="#all-brands">View all brands</a></div>
            <div class="brand-featured" data-featured-brands aria-live="polite"></div>
          </div>
        </section>

        <section class="section brand-section brand-section--directory" id="all-brands" aria-labelledby="directory-title">
          <div class="wrap">
            <div class="brand-section__head"><div><p class="eyebrow">Directory</p><h2 id="directory-title">All brands</h2></div><p class="cap" data-brand-status aria-live="polite"></p></div>
            <nav class="brand-alphabet" data-brand-alphabet aria-label="Brand alphabet"></nav>
            <div class="brand-directory" data-brand-directory></div>
          </div>
        </section>

      </main>
      <footer class="ft"></footer>
    </div>
  </body>
</html>
